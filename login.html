{% extends "base.html" %}
{% block content %}
<div class="animate-entrance" style="min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-portal" style="width: 100%; max-width: 460px; padding: 4rem; background: white; border: 1px solid var(--border);">
        <div style="text-align: center; margin-bottom: 3rem;">
            <div style="width: 64px; height: 64px; background: rgba(0, 51, 102, 0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                <i class="fa-solid fa-lock" style="font-size: 1.25rem; color: var(--primary);"></i>
            </div>
            <h2 style="font-weight: 800; font-size: 1.75rem; color: var(--primary); letter-spacing: -0.5px;" data-t="login_gateway">Strategic Gateway</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.5rem;" data-t="login_desc">Secure access to CrowdCast 2034.</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;" data-t="label_email">Email Address</label>
                <input type="email" name="email" data-t="email" placeholder="admin@crowdcast.com" required style="margin: 0;">
            </div>
            
            <div style="margin-bottom: 2.5rem;">
                <label style="display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;" data-t="label_pass">Security Password</label>
                <input type="password" name="password" data-t="password" placeholder="••••••••" required style="margin: 0;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; height: 54px; justify-content: center; font-size: 1rem; border-radius: 12px; background: var(--grad-primary);">
                <span data-t="btn_auth">Authenticate</span>
                <i class="fa-solid fa-shield-check"></i>
            </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #f1f5f9; text-align: center;">
            <p style="font-size: 0.85rem; color: #94a3b8;"><span data-t="no_account">Don't have an account?</span> <a href="{{ url_for('auth.index') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;" data-t="explore_path">Explore Path</a></p>
        </div>
    </div>
</div>
{% endblock %}
